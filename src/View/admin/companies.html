<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestion des Entreprises - StageManager</title>
    <link
      rel="stylesheet"
      href="../../../public/assets/css/admin_dashboard.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <div class="container">
      <!-- Sidebar -->
      <nav class="sidebar">
        <div class="logo">
          <i class="fas fa-shield-alt"></i>
          <span>Admin Panel</span>
        </div>
        <ul class="nav-links">
          <li>
            <a href="overview.html"
              ><i class="fas fa-home"></i> Vue d'ensemble</a
            >
          </li>
          <li class="active">
            <a href="companies.html"
              ><i class="fas fa-building"></i> Entreprises</a
            >
          </li>
          <li>
            <a href="internships.html"
              ><i class="fas fa-briefcase"></i> Offres de stage</a
            >
          </li>
          <li>
            <a href="pilots.html"><i class="fas fa-user-tie"></i> Pilotes</a>
          </li>
          <li>
            <a href="students.html"
              ><i class="fas fa-user-graduate"></i> Étudiants</a
            >
          </li>
          <li>
            <a href="applications.html"
              ><i class="fas fa-file-alt"></i> Candidatures</a
            >
          </li>
          <li>
            <a href="settings.html"><i class="fas fa-cog"></i> Paramètres</a>
          </li>
        </ul>
      </nav>
      <!-- Main Content -->
      <main class="main-content">
        <!-- Header -->
        <header class="header">
          <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="Rechercher..." />
          </div>
          <div class="user-menu">
            <div class="notifications">
              <i class="fas fa-bell"></i>
              <span class="badge">5</span>
            </div>
            <div class="profile">
              <img src="https://ui-avatars.com/api/?name=Admin" alt="Profile" />
              <span>Administrateur</span>
            </div>
          </div>
        </header>
        <!-- Dashboard Content -->
        <div class="dashboard-content">
          <section id="companies" class="section-content active">
            <div class="section-header">
              <h1>Gestion des Entreprises</h1>
              <button class="btn-primary" id="addCompany">
                <i class="fas fa-plus"></i> Nouvelle entreprise
              </button>
            </div>
            <div class="filters">
              <button class="filter-btn active">Toutes</button>
              <button class="filter-btn">Tech</button>
              <button class="filter-btn">Finance</button>
              <button class="filter-btn">Marketing</button>
            </div>
            <div class="data-table">
              <table>
                <thead>
                  <tr>
                    <th>Entreprise</th>
                    <th>Secteur</th>
                    <th>Offres actives</th>
                    <th>Évaluation</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td>
                      <div class="company-info">
                        <img
                          src="https://ui-avatars.com/api/?name=Tech+Corp"
                          alt="Company"
                        />
                        <span>TechCorp</span>
                      </div>
                    </td>
                    <td>Technologie</td>
                    <td>12</td>
                    <td>
                      <div class="rating">
                        <i class="fas fa-star"></i>
                        <span>4.5/5</span>
                      </div>
                    </td>
                    <td>
                      <div class="actions">
                        <button class="btn-icon" title="Modifier">
                          <i class="fas fa-edit"></i>
                        </button>
                        <button
                          onclick="showPopup()"
                          class="btn-icon"
                          title="Supprimer"
                        >
                          <i class="fas fa-trash"></i>
                        </button>
                      </div>
                    </td>
                  </tr>
                  <tr>
                    <td>
                      <div class="company-info">
                        <img
                          src="https://ui-avatars.com/api/?name=Data+Insight"
                          alt="Company"
                        />
                        <span>DataInsight</span>
                      </div>
                    </td>
                    <td>Data Science</td>
                    <td>8</td>
                    <td>
                      <div class="rating">
                        <i class="fas fa-star"></i>
                        <span>4.2/5</span>
                      </div>
                    </td>
                    <td>
                      <div class="actions">
                        <button class="btn-icon" title="Modifier">
                          <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn-icon" title="Supprimer">
                          <i class="fas fa-trash"></i>
                        </button>
                      </div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>
        </div>
      </main>
    </div>
    <script src="../../../public/assets/js/admin_dashboard.js"></script>
  </body>
</html>
