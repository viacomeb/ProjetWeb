<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestion des Pilotes - StageManager</title>
    <link
      rel="stylesheet"
      href="../../../public/assets/css/admin_dashboard.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <div class="container">
      <!-- Sidebar -->
      <nav class="sidebar">
        <div class="logo">
          <i class="fas fa-shield-alt"></i>
          <span>Admin Panel</span>
        </div>
        <ul class="nav-links">
          <li data-section="overview">
            <a href="overview.html"
              ><i class="fas fa-home"></i> Vue d'ensemble</a
            >
          </li>
          <li data-section="companies">
            <a href="companies.html"
              ><i class="fas fa-building"></i> Entreprises</a
            >
          </li>
          <li data-section="internships">
            <a href="internships.html"
              ><i class="fas fa-briefcase"></i> Offres de stage</a
            >
          </li>
          <li class="active" data-section="pilots">
            <a href="pilots.html"><i class="fas fa-user-tie"></i> Pilotes</a>
          </li>
          <li data-section="students">
            <a href="students.html"
              ><i class="fas fa-user-graduate"></i> Étudiants</a
            >
          </li>
          <li data-section="applications">
            <a href="applications.html"
              ><i class="fas fa-file-alt"></i> Candidatures</a
            >
          </li>
          <li data-section="settings">
            <a href="settings.html"><i class="fas fa-cog"></i> Paramètres</a>
          </li>
        </ul>
      </nav>
      <!-- Main Content -->
      <main class="main-content">
        <!-- Header -->
        <header class="header">
          <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="Rechercher..." />
          </div>
          <div class="user-menu">
            <div class="notifications">
              <i class="fas fa-bell"></i>
              <span class="badge">5</span>
            </div>
            <div class="profile">
              <img src="https://ui-avatars.com/api/?name=Admin" alt="Profile" />
              <span>Administrateur</span>
            </div>
          </div>
        </header>
        <!-- Dashboard Content -->
        <div class="dashboard-content">
          <section id="pilots" class="section-content active">
            <div class="section-header">
              <h1>Gestion des Pilotes</h1>
              <button class="btn-primary" id="addPilot">
                <i class="fas fa-plus"></i> Nouveau pilote
              </button>
            </div>
            <div class="filters">
              <button class="filter-btn active">Tous</button>
              <button class="filter-btn">Actifs</button>
              <button class="filter-btn">En congé</button>
            </div>
            <div class="data-table">
              <table>
                <thead>
                  <tr>
                    <th>Nom</th>
                    <th>Email</th>
                    <th>Étudiants</th>
                    <th>Statut</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td>Jean Martin</td>
                    <td>jean.martin@example.com</td>
                    <td>25</td>
                    <td>
                      <span class="status active">Actif</span>
                    </td>
                    <td>
                      <div class="actions">
                        <button class="btn-icon" title="Modifier">
                          <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn-icon" title="Supprimer">
                          <i class="fas fa-trash"></i>
                        </button>
                      </div>
                    </td>
                  </tr>
                  <tr>
                    <td>Marie Dupont</td>
                    <td>marie.dupont@example.com</td>
                    <td>30</td>
                    <td>
                      <span class="status on-leave">En congé</span>
                    </td>
                    <td>
                      <div class="actions">
                        <button class="btn-icon" title="Modifier">
                          <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn-icon" title="Supprimer">
                          <i class="fas fa-trash"></i>
                        </button>
                      </div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>
        </div>
      </main>
    </div>
    <script src="../../../public/assets/js/admin_dashboard.js"></script>
  </body>
</html>
